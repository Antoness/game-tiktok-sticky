<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="80%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Golden Wing Left -->
  <path d="M 180 80 Q 80 40 20 15 Q 80 75 140 100 Q 180 110 200 85 Z" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.9"/>
  <path d="M 160 85 Q 90 60 40 45 Q 90 90 145 110 Z" fill="url(#goldGrad)"/>
  
  <!-- Golden Wing Right -->
  <path d="M 420 80 Q 520 40 580 15 Q 520 75 460 100 Q 420 110 400 85 Z" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.9"/>
  <path d="M 440 85 Q 510 60 560 45 Q 510 90 455 110 Z" fill="url(#goldGrad)"/>

  <!-- Center Shield Base -->
  <polygon points="300,10 345,35 335,85 300,110 265,85 255,35" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Crystal Gem in Shield -->
  <polygon points="300,25 325,45 318,75 300,90 282,75 275,45" fill="url(#blueGrad)" stroke="#E0F2FE" stroke-width="1.5"/>
  <polygon points="300,35 315,50 300,80 285,50" fill="#38BDF8" opacity="0.8"/>

  <!-- Crown on Top -->
  <path d="M 285 20 L 290 8 L 300 15 L 310 8 L 315 20 Z" fill="url(#goldGrad)"/>

  <!-- MOBILE LEGENDS TEXT -->
  <text x="300" y="115" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="900" font-style="italic" letter-spacing="4" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="8">MOBILE LEGENDS</text>
  <text x="300" y="115" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="900" font-style="italic" letter-spacing="4" text-anchor="middle" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.5" filter="url(#glow)">MOBILE LEGENDS</text>

  <!-- BANG BANG RIBBON -->
  <rect x="210" y="126" width="180" height="24" rx="6" fill="#991B1B" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="300" y="143" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" letter-spacing="5" text-anchor="middle" fill="#FEF08A">BANG BANG</text>
</svg>